name: CI

# Mirrors the neomundi SDK's own workflow deliberately: same discipline,
# same offline guarantee. The matrix floor is 3.11 because LangChain 1.x
# requires it -- the SDK itself still supports 3.9.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,examples]"
      # No secret, no network, no cost. If this job ever needs a key,
      # something has gone wrong with the test harness.
      - name: Tests
        run: pytest -q
      # No inline heredoc: this matrix includes windows-latest, where the
      # step shell is PowerShell and a heredoc is a parse error.
      - name: Package builds and carries py.typed
        run: |
          python -m pip install build
          python -m build --wheel
          python scripts/check_wheel.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .
