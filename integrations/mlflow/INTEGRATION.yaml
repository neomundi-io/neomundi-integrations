# The single source of truth for this integration.
#
# The library index, the catalogue and the badges are GENERATED from this
# file and its siblings. `tools/check_conformance.py` validates it.

slug: mlflow
name: MLflow
technology:
  name: MLflow Tracing
  homepage: https://mlflow.org/docs/latest/genai/tracing/
  what_it_is: >-
    The tracing layer of MLflow, built on OpenTelemetry: autolog
    instrumentations for model clients and agent frameworks record each
    call as a span in a trace, stored next to the experiments and runs MLflow
    users already compare.

package:
  name: mlflow-neomundi
  import_name: mlflow_neomundi
  version: 0.1.0
  # This field describes the version declared just above, not the project's
  # whole history. 0.1.0 was installed from PyPI into a clean virtual
  # environment and inspected there before this flipped -- the index renders
  # a copyable `pip install` from it, so it must never claim a version that
  # cannot be installed.
  published_on: pypi
  pypi_url: https://pypi.org/project/mlflow-neomundi/

# Package lifecycle, not evidence. It has measured real calls against
# production, which is what moved litellm and openai-agents to beta on the
# same axis. Not "stable": the package is new.
maturity: beta

evidence:
  # E0 nothing yet, E1 offline tests, E2 + real execution against
  # production, E3 + independently reproduced.
  #
  # E2 since 2026-11-26: four real billed observations against production,
  # each re-read from the API afterwards. The number below is the RE-READ
  # count, not the submitted count -- an acknowledged submission is not a
  # persisted one -- and `check_conformance.py` verifies both against the
  # evidence file rather than trusting this manifest.
  level: e2
  offline_tests: 75
  real_observations: 4
  observations_verified_persisted: 4
  cost_chf: 0.12
  proof: evidence/e2_qualification_20261126T165539Z.json
  reason: >-
    Four real model calls traced by the real mlflow.openai.autolog into a
    throwaway local store, against Ollama's OpenAI-compatible endpoint: two
    Chat Completions inside an application span, one Responses API call,
    and one stream with stream_options.include_usage. All four served
    measurement_version 3.5.0 and were re-read as persisted. Two further
    phases were refused on real spans and billed nothing: a stream WITHOUT
    include_usage (the provider published no usage, and a count is never
    estimated in its place) and a hand-written LLM span carrying a count
    the way LiteLLM's MLflow logger writes its estimate (unverified
    provenance). The aggregate application span is refused as an aggregate,
    so nothing is double-counted.

compatibility:
  python: ["3.11", "3.12", "3.13"]
  platforms: [linux, macos, windows]
  target:
    name: mlflow-tracing
    min: "3.18.0"
    max: "<3.19"
    verified: "3.18.0"
  neomundi_sdk:
    min: "2.1.0"
    verified: "2.1.0"
  # Writers driven by the mission probes and the suite. Not runtime dependencies.
  writers_verified:
    - "openai (mlflow.openai.autolog) -- openai 3.60.0 -- measured"
    - "openai-agent (Agents SDK tracer) -- openai-agents 0.26.0 -- refused, 0/0/0 on a silent provider"
    - "langchain (mlflow.langchain.autolog) -- langchain-core 1.8.5 -- refused, copies any usage_metadata"
    - "no writer (LiteLLM's MlflowLogger) -- litellm 1.111.0 -- refused, estimate 14/7/21 on a silent provider (probe only)"
  # Observed live on every observation of the E2 run.
  measurement_version_verified: "3.5.0 (served live, 4 observations re-read)"

value:
  host_keeps: >-
    MLflow keeps its autolog instrumentation, the traces, the tracking
    store, the UI, experiments and run comparison. The integration appends
    one function to MLflow's own span processors and replaces nothing.
  neomundi_adds: >-
    Signed, independently verifiable behavioural measurement of each model
    call MLflow traced, with the provider's own token count and the latency
    MLflow recorded -- and the NeoMundi request_id and measurement version
    written back on the MLflow trace, next to the run you compare.
  complements_not_replaces:
    - MLflow Tracing and its autolog integrations
    - the MLflow UI, experiments and evaluation
    - otel-neomundi
    - openai-agents-neomundi
    - langchain-neomundi
  typical_use:
    - Measure the model calls of an application MLflow already traces, without a second instrumentation.
    - Open an MLflow trace and find the NeoMundi observation that measured it, by its request_id tag.
    - Compare two runs only when their measurement_version matches, as you already do for model versions.
    - Find out, for free, which of your traced calls could be measured, with submit=False.

entrypoint:
  kind: span_processor_hook
  symbol: mlflow_neomundi.NeoMundiMlflowProcessor
  snippet: |
    mlflow.openai.autolog()
    processor = NeoMundiMlflowProcessor(api_key=..., base_url="https://api.neomundi.io").install()
    client.chat.completions.create(model=..., messages=...)
    processor.flush()

refusals:
  - A count written by anything but MLflow's openai autolog -- the Agents SDK tracer's zero fill, LiteLLM's estimate, LangChain's usage_metadata, a hand-written span -- is never submitted.
  - No provider usage, a partial one or a zero total; never estimated, never rebuilt.
  - Agent, chain, workflow and task spans are sums of calls already measured; tools, retrievers and embeddings are not model calls.
  - The measurement API is unreachable, so the failure is reported and your call is untouched.

billing:
  metered: true
  note: >-
    Every submitted observation is a billed measurement; there is no
    trace-only route. One observation per measured model call; aggregate
    spans are never billed. Start with submit=False, which needs no key and
    opens no socket.

