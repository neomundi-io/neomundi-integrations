[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm-neomundi"
version = "0.1.0"
description = "Measure every completion that goes through LiteLLM with the NeoMundi measurement API"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Sebastien FAVRE", email = "sebastien@neomundi.org" }]
# The library floor. LiteLLM itself accepts 3.10.
requires-python = ">=3.11"
keywords = ["litellm", "neomundi", "ai-governance", "llm-measurement", "observability", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Two dependencies, both unavoidable: the measurement client and the
# CustomLogger base class.
#
# `litellm` is pinned at >=1.111.0 because the hook signatures, the
# keyword-argument calling convention and the shape of `original_response`
# this logger relies on were introspected on 1.111.0 -- and LiteLLM moves
# fast enough that an older release is not assumed to match.
dependencies = [
    "litellm>=1.111.0,<2.0",
    "neomundi>=2.1.0,<3.0",
]

[project.optional-dependencies]
# `httpx.MockTransport` ships with httpx, and the OpenAI client LiteLLM
# already depends on accepts one: the suite opens no socket.
dev = [
    "pytest>=8.0",
]

# Nothing extra: the examples run offline on the runtime dependencies.
examples = []

notebook = [
    "nbformat>=5.9",
    "nbclient>=0.9",
    "ipykernel>=6.29",
]

[project.urls]
Homepage = "https://github.com/neomundi-io/neomundi-integrations/tree/main/integrations/litellm"
Repository = "https://github.com/neomundi-io/neomundi-integrations"
Documentation = "https://github.com/neomundi-io/neomundi-integrations/tree/main/integrations/litellm#readme"
Changelog = "https://github.com/neomundi-io/neomundi-integrations/blob/main/integrations/litellm/CHANGELOG.md"
Issues = "https://github.com/neomundi-io/neomundi-integrations/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litellm_neomundi = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/litellm_neomundi/__init__.py" = ["E402"]
