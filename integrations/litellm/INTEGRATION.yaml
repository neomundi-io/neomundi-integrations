# The single source of truth for this integration.
#
# The library index, the catalogue and the badges are GENERATED from this
# file and its siblings. `tools/check_conformance.py` validates it.

slug: litellm
name: LiteLLM
technology:
  name: LiteLLM
  homepage: https://www.litellm.ai/
  what_it_is: >-
    An LLM gateway: one OpenAI-style API to 100+ providers, as a Python
    library or as a proxy server, with routing, retries, budgets and logging
    callbacks.

package:
  name: litellm-neomundi
  import_name: litellm_neomundi
  version: 0.1.0
  # This field describes the version declared just above, not the project's
  # whole history. 0.1.0 was installed from PyPI into a clean virtual
  # environment and inspected there before this flipped -- the index renders
  # a copyable `pip install` from it, so it must never claim a version that
  # cannot be installed.
  published_on: pypi
  pypi_url: https://pypi.org/project/litellm-neomundi/

# Package lifecycle, not evidence. Experimental: it has not yet measured a
# single real completion.
maturity: beta

evidence:
  # E0 nothing yet, E1 offline tests, E2 + real execution against
  # production, E3 + independently reproduced.
  #
  # CHECKED, NOT TRUSTED: tools/check_conformance.py opens the proof and
  # compares these numbers against what it actually contains.
  level: e2
  offline_tests: 47
  real_observations: 4
  observations_verified_persisted: 4
  proof: evidence/e2_qualification_20261126T094917Z.json
  cost_chf: 0.12
  # The route matters here. LiteLLM's native `ollama/` route hands the
  # logger original_response = None, so the count cannot be proven to be
  # the provider's and is refused. The proof records that refusal on a
  # real call, which is why it carries six phases for four observations.
  route: "openai-compatible endpoint (the provider publishes its usage block)"

compatibility:
  python: ["3.11", "3.12", "3.13"]
  platforms: [linux, macos, windows]
  target:
    name: litellm
    min: "1.111.0"
    max: "<2.0"
    verified: "1.111.0"
  neomundi_sdk:
    min: "2.1.0"
    verified: "2.1.0"
  # The fixture the suite replays was produced under 3.3.1. The E2 run
  # observed 3.5.0 served live on every one of its four observations.
  measurement_version_verified: "3.5.0 (served live, 4 observations re-read)"

value:
  host_keeps: >-
    LiteLLM keeps routing, retries, fallbacks, budgets, virtual keys, its
    cost table and whatever logging callbacks you already run.
  neomundi_adds: >-
    Signed, independently verifiable behavioural measurement of every chat
    completion the gateway routes, to any provider, from one attachment
    point -- with the latency LiteLLM observed, and only token counts the
    provider itself published.
  complements_not_replaces:
    - LiteLLM logging callbacks
    - Langfuse
    - langchain-neomundi
  typical_use:
    - Measure every provider behind a LiteLLM Proxy without instrumenting each application.
    - Detect a behavioural regression after a routing or model change that latency and cost do not show.
    - Find out, for free, which of your providers publish usage at all, with submit=False.

entrypoint:
  kind: custom_logger
  symbol: litellm_neomundi.NeoMundiLogger
  snippet: |
    logger = NeoMundiLogger(api_key=..., base_url="https://api.neomundi.io")
    litellm.callbacks = [logger]
    answer = litellm.completion(model="ollama_chat/llama3.2", messages=messages)

refusals:
  - The provider published no token count; LiteLLM's zero or estimate is refused, never forwarded.
  - An async stream hides the provider's payload from the logger, so it is refused rather than trusted.
  - A cache hit, a failed call or a non-chat call is not a model interaction to measure.
  - The measurement API is unreachable, so the failure is reported and your call is untouched.

billing:
  metered: true
  note: >-
    Every submitted observation is a billed measurement; there is no
    trace-only route. sample_rate defaults to 1.0 and a gateway sees every
    call -- start with submit=False, which needs no key and opens no socket.

links:
  readme: README.md
  readme_fr: README_FR.md
  limitations: LIMITATIONS.md
  value: VALUE.md
  mission_report: MISSION_REPORT.md
  changelog: CHANGELOG.md
  notebook: notebooks/quickstart.ipynb
  examples: examples/

delivered: 2026-11-26
last_verified: 2026-11-26
