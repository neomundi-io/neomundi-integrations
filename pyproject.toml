# Library-level tooling configuration only. Each integration declares its
# own dependencies, its own Python floor and its own build in
# integrations/<slug>/pyproject.toml. This file is deliberately not a
# distributable package: the library is a monorepo, not a meta-package.

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["templates", ".venv", "**/.venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# API_CONTRACT and INTEGRATION_CONTRACT are defined before the re-exports,
# deliberately: they are the first thing a reader of the module must see.
"integrations/*/src/*/__init__.py" = ["E402"]
# Tooling imports the sibling registry module after adjusting sys.path,
# which is the whole point.
"tools/*.py" = ["E402"]
